[project]
name = "textkit"
version = "0.3.1"
description = "用于演示 Fissue 的小型文本处理库"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "textkit maintainers" }]
keywords = ["text", "slugify", "wrap", "demo"]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/"
Issues = "https://github.com/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["textkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
